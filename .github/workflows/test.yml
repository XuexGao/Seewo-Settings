name: Test

# Verifies the application this repository produces, rather than only that it
# compiles. Runs after the Build workflow, on the artifact that workflow uploaded.
#
# Split from build.yml deliberately: these checks answer a different question.
# Build asks "does it compile"; Test asks "does it actually run, render, and do the
# things it claims". A failure here means a real user-visible defect, and it should
# not be confused with a compilation error.

on:
  # Runs after every build of a branch or pull request.
  workflow_run:
    workflows: ['Build']
    types: [completed]
  # Also runnable on demand, which is useful when investigating a report.
  workflow_dispatch:
    inputs:
      run_id:
        description: '要测试的 Build run ID（留空则使用最近一次成功的构建）'
        required: false
        type: string

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  smoke-test:
    name: UI smoke test (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      # The runner starts with no interactive desktop session for a service, but
      # the Actions runner does run in an interactive session, which is what makes
      # launching a GUI app and screenshotting it possible at all.
      - name: Report the session context
        shell: pwsh
        run: |
          Write-Host "UserInteractive : $([Environment]::UserInteractive)"
          Write-Host "Session ID      : $((Get-Process -Id $PID).SessionId)"
          Add-Type -AssemblyName System.Windows.Forms
          $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
          Write-Host "Virtual screen  : $($bounds.Width)x$($bounds.Height)"

      # Resolve which Build run to test. workflow_run gives the run that triggered
      # this one; a manual dispatch can name one explicitly, otherwise the most recent
      # successful build on the same branch is used.
      - name: Resolve the build run to test
        id: resolve
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $runId = ''

          if ('${{ github.event_name }}' -eq 'workflow_run') {
            $runId = '${{ github.event.workflow_run.id }}'

            # A failed build has no artifact worth testing.
            if ('${{ github.event.workflow_run.conclusion }}' -ne 'success') {
              Write-Host '触发的 Build 没有成功，跳过测试。' -ForegroundColor Yellow
              "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              exit 0
            }
          }
          elseif ('${{ inputs.run_id }}') {
            $runId = '${{ inputs.run_id }}'
          }
          else {
            $runId = gh run list --workflow=build.yml --status=success --limit=1 `
              --json databaseId --jq '.[0].databaseId'
          }

          if ([string]::IsNullOrWhiteSpace($runId)) {
            Write-Error '找不到可用于测试的 Build run。'
            exit 1
          }

          Write-Host "将测试 Build run: $runId"
          "run_id=$runId" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Downloads from the Build run rather than from this workflow's own run, which
      # produces no artifacts.
      - name: Download the release archive
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/download-artifact@v7
        with:
          name: SeewoAssistant-release
          path: artifacts/dist
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract the release
        if: steps.resolve.outputs.skip != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -Path 'artifacts/dist/SeewoAssistant-win-x64.zip' `
            -DestinationPath 'artifacts/app' -Force
          Get-ChildItem 'artifacts/app' | Select-Object Name, Length | Format-Table -AutoSize

      # The virtual camera needs a registered COM server, which needs elevation.
      # The runner is an administrator, and `Install-Native.ps1` reports what it
      # did, which is useful context even when it cannot fully succeed.
      - name: Attempt to install the native components
        if: steps.resolve.outputs.skip != 'true'
        shell: pwsh
        continue-on-error: true
        run: |
          & 'artifacts/app/scripts/Install-Native.ps1' -Action Status
          Write-Host ''
          & 'artifacts/app/scripts/Install-Native.ps1' -Action Install

      - name: Run the UI smoke test
        if: steps.resolve.outputs.skip != 'true'
        id: smoke
        shell: pwsh
        run: |
          & './scripts/ci/Smoke-Test.ps1' `
            -AppPath (Resolve-Path 'artifacts/app/SeewoAssistant.exe').Path `
            -OutputDirectory 'artifacts/screenshots'

      # Screenshots, the collected app log and the findings list are uploaded even
      # when the smoke test fails, because on failure they are exactly what is
      # needed to work out why.
      - name: Upload the screenshots and logs
        if: always() && steps.resolve.outputs.skip != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ui-screenshots
          path: |
            artifacts/screenshots/**
          if-no-files-found: warn
          retention-days: 30

      # The camera check is informational: whether a virtual camera becomes
      # enumerable depends on the runner's privacy settings and elevation, so it is
      # reported rather than enforced.
      # Runs the tool and asserts its output is readable. The tool writes UTF-8 when
      # its output is redirected, but an earlier version forced the console into
      # UTF-16 and produced interleaved NUL bytes in this very log, which decodes as
      # mojibake. Nobody noticed until the log was read closely, so it is now a check
      # rather than something to notice by eye.
      - name: Verify the setup tool output is readable
        if: always() && steps.resolve.outputs.skip != 'true'
        shell: pwsh
        run: |
          $setup = 'artifacts/app/SeewoVirtualCamera.Setup.exe'
          $rawFile = Join-Path $env:RUNNER_TEMP 'setup-output.bin'

          # The raw bytes are captured straight to a file with Start-Process, then
          # read back with an explicit encoding. Capturing through PowerShell's own
          # pipeline (`& $setup ... | Out-String`) makes the result depend on
          # [Console]::OutputEncoding and on $OutputEncoding, and setting those does
          # not reliably change how a native command's stdout is decoded - which is
          # precisely the confusion this check exists to remove. Going through a file
          # tests the tool's actual bytes and nothing else.
          $process = Start-Process -FilePath $setup -ArgumentList 'list' `
            -RedirectStandardOutput $rawFile -NoNewWindow -Wait -PassThru

          Write-Host "安装工具退出码：$($process.ExitCode)"

          $bytes = [System.IO.File]::ReadAllBytes($rawFile)
          Write-Host "输出字节数：$($bytes.Length)"

          $problems = @()

          # A NUL byte means the tool wrote UTF-16 to a redirected stream, which is
          # the specific defect this check was added for.
          if ($bytes -contains 0) {
            $problems += '输出中出现了 NUL 字节（说明用了 UTF-16 写入重定向流）'
          }

          # Decode strictly: invalidUTF-8 sequences become U+FFFD, so a wrong
          # encoding shows up as replacement characters rather than passing silently.
          $strict = [System.Text.UTF8Encoding]::new($false, $true)
          $output = $null

          try {
            $output = $strict.GetString($bytes)
          }
          catch {
            $problems += '输出不是合法的 UTF-8'
          }

          if ($null -ne $output) {
            Write-Host '--- 输出内容 ---'
            Write-Host $output
            Write-Host '----------------'

            if ($output -notmatch '[\u4e00-\u9fff]') {
              $problems += '输出中没有找到任何中文字符，编码很可能不对'
            }
            if ($output -notmatch '视频输入设备') {
              $problems += '输出中缺少预期标题「视频输入设备」'
            }
          }

          if ($problems.Count -gt 0) {
            Write-Host ''
            Write-Error "安装工具输出不可读：$($problems -join '；')"
            exit 1
          }

          Write-Host '安装工具输出为合法 UTF-8，且内容符合预期。' -ForegroundColor Green

      - name: Report the virtual camera API support
        if: always() && steps.resolve.outputs.skip != 'true'
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host '=== 虚拟摄像头 API 支持情况 ==='
          & 'artifacts/app/SeewoVirtualCamera.Setup.exe' check

      # What the build controls, asserted strictly: the media source CLSID must be
      # registered under HKLM with an InProcServer32 entry pointing at the DLL that
      # was actually shipped. If this is wrong, no virtual camera can ever appear, so
      # it is a hard failure rather than a note.
      - name: Verify the media source COM registration
        if: always() && steps.resolve.outputs.skip != 'true'
        shell: pwsh
        run: |
          # Read the CLSID from the header that defines it rather than repeating the
          # literal here. It appears in the native header, in the C# constant and in
          # this check; a typo in any copy would silently test the wrong key.
          $header = 'native/SeewoVirtualCamera/SeewoVirtualCameraActivate.h'
          $match = Select-String -Path $header -Pattern '\{A7E4B2C1-[0-9A-Fa-f-]+\}' |
            Select-Object -First 1

          if (-not $match) {
            Write-Error "无法从 $header 读取 CLSID"
            exit 1
          }

          $clsid = $match.Matches[0].Value
          Write-Host "从 $header 读取到 CLSID：$clsid"

          $key = "HKLM:\SOFTWARE\Classes\CLSID\$clsid\InProcServer32"

          if (-not (Test-Path $key)) {
            Write-Error "媒体源 CLSID 未注册：$clsid"
            exit 1
          }

          $dllPath = (Get-ItemProperty $key).'(default)'
          $threading = (Get-ItemProperty $key).'ThreadingModel'

          Write-Host "CLSID        : $clsid"
          Write-Host "DLL 路径     : $dllPath"
          Write-Host "ThreadingModel: $threading"

          $problems = @()

          if ([string]::IsNullOrWhiteSpace($dllPath)) {
            $problems += 'InProcServer32 的默认值（DLL 路径）为空'
          }
          elseif (-not (Test-Path $dllPath)) {
            $problems += "注册的 DLL 路径不存在：$dllPath"
          }
          elseif ((Split-Path -Leaf $dllPath) -ne 'SeewoVirtualCamera.dll') {
            $problems += "注册指向的不是媒体源 DLL：$dllPath"
          }

          if ($threading -ne 'Both') {
            $problems += "ThreadingModel 是 '$threading'，应为 'Both'"
          }

          if ($problems.Count -gt 0) {
            Write-Error "COM 注册不正确：$($problems -join '；')"
            exit 1
          }

          Write-Host '媒体源 COM 注册正确。' -ForegroundColor Green

      # Reading actual frames is the strongest check of the media source, but whether
      # a virtual camera can start at all depends on the runner having a working
      # video stack and camera access enabled. Neither is under the build's control,
      # so this step reports what it observed and does not fail the job: the captured
      # frame is uploaded either way, which is what makes a real regression visible
      # instead of being masked by an environment limitation.
      - name: Capture frames from the virtual camera
        if: always() && steps.resolve.outputs.skip != 'true'
        shell: pwsh
        continue-on-error: true
        run: |
          $setup = 'artifacts/app/SeewoVirtualCamera.Setup.exe'
          $png = 'artifacts/screenshots/camera-frame.png'

          Write-Host '=== 从虚拟摄像头读取画面 ==='

          # The tool exits non-zero when it cannot read frames. That is handled here
          # rather than left to fail the step, so an environment limitation reads as
          # a note and a genuine regression is still visible in the output below.
          & $setup capture --frames 60 --out $png
          $captureExit = $LASTEXITCODE

          Write-Host "capture 退出码：$captureExit"

          if (Test-Path $png) {
            $size = (Get-Item $png).Length
            Write-Host "已保存画面：$png ($size 字节)" -ForegroundColor Green
            "摄像头取帧：成功（$size 字节）" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            $stepExit = 0
          }
          else {
            Write-Host '没有产生画面文件。' -ForegroundColor Yellow

            # Say plainly which of the two situations this is, so the log is not
            # ambiguous the next time it is read.
            if ($captureExit -eq 7) {
              Write-Host '原因：摄像头已注册但无法激活。CI 虚拟机通常没有可用的视频栈，这是环境限制，不是代码缺陷。' -ForegroundColor Yellow
              "摄像头取帧：未激活（环境限制，CI 虚拟机无视频设备）" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              $stepExit = 0
            }
            elseif ($captureExit -eq 8 -or $captureExit -eq 9) {
              Write-Host '原因：摄像头已激活但没有输出有效画面。这可能是真实缺陷，请检查上方输出。' -ForegroundColor Red
              "摄像头取帧：失败（已激活但无有效画面）" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              $stepExit = 1
            }
            else {
              Write-Host "原因：capture 以退出码 $captureExit 结束。" -ForegroundColor Yellow
              "摄像头取帧：退出码 $captureExit" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              $stepExit = 1
            }
          }

          # End with a deliberate exit code rather than letting $LASTEXITCODE leak out.
          # The pwsh wrapper the runner generates exits with $LASTEXITCODE when it is set,
          # so the diagnostic call above decided this step's result. On the CI VM capture
          # always returns 7 because there is no video stack, which produced a
          # "Process completed with exit code 1" failure annotation on every run - a
          # signal with no information in it, and the kind that teaches people to ignore
          # annotations. Exit code 7 is now a clean pass; 8, 9 and anything else still
          # record a failure, so a genuine regression keeps the marker it had.
          exit $stepExit

      # The reported defect this pins: `-Action Uninstall` and `-Action Cleanup` are two
      # paths to the same end state, and they diverged. Uninstall ran `regsvr32 /u`,
      # which removes the filter from the video-input-device category; Cleanup deleted
      # the CLSID key directly and left the category entry, so the camera stayed in
      # every DirectShow enumeration pointing at a CLSID that no longer existed. Only
      # the Uninstall path had been checked, which is how it got through.
      #
      # The filter is registered here explicitly rather than relying on the earlier
      # install step. On a Windows 11 runner `Install-Native.ps1` deliberately
      # registers the Media Foundation backend instead - the DirectShow filter is the
      # Windows 10 fallback - so without this the category entry would never exist and
      # the assertions below would pass while testing nothing. The registration is
      # done, checked to have taken effect, and only then cleaned up.
      - name: Verify cleanup removes the DirectShow category entry too
        if: always() && steps.resolve.outputs.skip != 'true'
        shell: pwsh
        run: |
          # Read both literals from the script rather than repeating them, so a rename
          # cannot make this check pass by testing keys nothing writes.
          $script = Get-Content 'scripts/Install-Native.ps1' -Raw

          $categoryMatch = [regex]::Match($script, "\$VideoInputDeviceCategoryClsid\s*=\s*'([^']+)'")
          $filterMatch = [regex]::Match($script, "\$DirectShowClsid\s*=\s*'([^']+)'")

          if (-not $categoryMatch.Success -or -not $filterMatch.Success) {
            Write-Error '无法从 Install-Native.ps1 读取分类 CLSID 或滤镜 CLSID。'
            exit 1
          }

          $categoryClsid = $categoryMatch.Groups[1].Value
          $filterClsid = $filterMatch.Groups[1].Value

          Write-Host "分类 CLSID：$categoryClsid"
          Write-Host "滤镜 CLSID：$filterClsid"

          $instancePath = "HKLM:\SOFTWARE\Classes\CLSID\$categoryClsid\Instance"
          $filterKey = "HKLM:\SOFTWARE\Classes\CLSID\$filterClsid"

          # Register the filter so there is something to remove. regsvr32 on the 64-bit
          # filter writes both the CLSID key and the category entry.
          $filterDll = (Resolve-Path 'artifacts/app/native/x64/SeewoVirtualCamera.DShow.dll').Path
          $regsvr = Start-Process regsvr32.exe -ArgumentList '/s', "`"$filterDll`"" -Wait -PassThru
          Write-Host "regsvr32 退出码：$($regsvr.ExitCode)"

          # If registration did not take, the rest of this step would prove nothing, so
          # that is a failure rather than a skip.
          if (-not (Test-Path $filterKey)) {
            Write-Error "注册后仍找不到滤镜 CLSID 键：$filterKey，本项检查无法进行。"
            exit 1
          }

          $before = @(Get-ChildItem $instancePath -ErrorAction SilentlyContinue |
            Where-Object { "$((Get-ItemProperty $_.PSPath -ErrorAction SilentlyContinue).CLSID)" -eq $filterClsid })

          if ($before.Count -eq 0) {
            Write-Error "注册后分类下没有本滤镜的条目：$instancePath，本项检查无法进行。"
            exit 1
          }

          Write-Host "注册后分类下有 $($before.Count) 个条目，开始清理。"

          & 'artifacts/app/scripts/Install-Native.ps1' -Action Cleanup

          $problems = @()

          if (Test-Path $filterKey) {
            $problems += "滤镜 CLSID 键仍在：$filterKey"
          }

          if (Test-Path $instancePath) {
            $left = @(Get-ChildItem $instancePath -ErrorAction SilentlyContinue |
              Where-Object { "$((Get-ItemProperty $_.PSPath -ErrorAction SilentlyContinue).CLSID)" -eq $filterClsid })

            if ($left.Count -gt 0) {
              $problems += "DirectShow 分类注册项仍在：$($left.Name -join ', ')"
            }
          }

          if ($problems.Count -gt 0) {
            Write-Error "Cleanup 没有清理干净：$($problems -join '；')"
            exit 1
          }

          Write-Host 'Cleanup 同时清除了滤镜 CLSID 和分类注册项。' -ForegroundColor Green
