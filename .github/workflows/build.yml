name: Build

# Builds the managed app and every native component, runs the unit tests, and
# publishes the runnable artifacts. Pushing a tag additionally creates a Release
# with the same files attached.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  # Keep the build deterministic and quiet.
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  # The runner has 4 cores and 16 GB; the managed build is small, but the native
  # build is memory hungry and parallel MSBuild instances add up.
  MSBUILDDISABLENODEREUSE: '1'

jobs:
  build:
    name: Build (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # The native projects pin a specific Windows SDK version. Printing what the
      # runner actually has makes a version mismatch obvious in the log instead of
      # surfacing as a confusing missing-header error.
      - name: Report the installed Windows SDKs
        shell: pwsh
        run: |
          $roots = @(
            "${env:ProgramFiles(x86)}\Windows Kits\10\Include",
            "$env:ProgramFiles\Windows Kits\10\Include"
          )
          foreach ($root in $roots) {
            if (Test-Path $root) {
              Write-Host "SDK include root: $root"
              Get-ChildItem $root -Directory | Select-Object -ExpandProperty Name | ForEach-Object { Write-Host "  $_" }
            }
          }
          Write-Host "MSBuild: $((Get-Command msbuild).Source)"

      - name: Show the MSBuild version
        run: msbuild -version

      # ------------------------------------------------------------------ native
      # Each native project is built separately rather than through the solution so a
      # failure names the exact component. continue-on-error keeps a failing native
      # project from hiding the managed build's diagnostics in the same run; the
      # "Verify the native outputs" step below is the real gate, and it fails the job
      # if any component did not produce its binary.

      - name: Build the Media Foundation virtual camera (x64)
        id: build_mf_camera
        continue-on-error: true
        run: >
          msbuild native/SeewoVirtualCamera/SeewoVirtualCamera.vcxproj
          /p:Configuration=Release /p:Platform=x64
          /m /v:minimal /nologo

      - name: Build the DirectShow virtual camera (x64)
        id: build_dshow_x64
        continue-on-error: true
        run: >
          msbuild native/SeewoVirtualCamera.DShow/SeewoVirtualCamera.DShow.vcxproj
          /p:Configuration=Release /p:Platform=x64
          /m /v:minimal /nologo

      - name: Build the DirectShow virtual camera (Win32)
        id: build_dshow_x86
        continue-on-error: true
        run: >
          msbuild native/SeewoVirtualCamera.DShow/SeewoVirtualCamera.DShow.vcxproj
          /p:Configuration=Release /p:Platform=Win32
          /m /v:minimal /nologo

      - name: Build the virtual camera setup tool (x64)
        id: build_setup_tool
        continue-on-error: true
        run: >
          msbuild native/SeewoVirtualCamera.Setup/SeewoVirtualCamera.Setup.vcxproj
          /p:Configuration=Release /p:Platform=x64
          /m /v:minimal /nologo

      - name: Build the capture guard payload (x64)
        id: build_payload_x64
        continue-on-error: true
        run: >
          msbuild native/SeewoCaptureGuard.Payload/SeewoCaptureGuard.Payload.vcxproj
          /p:Configuration=Release /p:Platform=x64
          /m /v:minimal /nologo

      - name: Build the capture guard payload (Win32)
        id: build_payload_x86
        continue-on-error: true
        run: >
          msbuild native/SeewoCaptureGuard.Payload/SeewoCaptureGuard.Payload.vcxproj
          /p:Configuration=Release /p:Platform=Win32
          /m /v:minimal /nologo

      # ------------------------------------------------------------------ managed
      # The managed projects are built individually rather than through the .sln,
      # because the solution also contains the C++ projects and `dotnet build` does
      # not drive vcxproj reliably.

      - name: Restore managed packages
        id: restore_managed
        continue-on-error: true
        run: dotnet restore src/SeewoAssistant/SeewoAssistant.csproj

      - name: Build the core library
        id: build_core
        continue-on-error: true
        run: dotnet build src/SeewoAssistant.Core/SeewoAssistant.Core.csproj -c Release -m:1

      - name: Build the test project
        id: build_tests
        continue-on-error: true
        run: dotnet build src/SeewoAssistant.Tests/SeewoAssistant.Tests.csproj -c Release -m:1

      - name: Build the application
        id: build_app
        continue-on-error: true
        run: dotnet build src/SeewoAssistant/SeewoAssistant.csproj -c Release -m:1 -p:Platform=x64

      # ------------------------------------------------------------------ gate
      # One place that decides whether the job passes, so every component's
      # diagnostics are visible in the same run before anything is published.

      - name: Verify the native outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $expected = @(
            @{ Name = 'Media Foundation 虚拟摄像头'; Path = 'artifacts/native/x64/Release/SeewoVirtualCamera.dll' },
            @{ Name = 'DirectShow 虚拟摄像头 (x64)';  Path = 'artifacts/native/x64/Release/SeewoVirtualCamera.DShow.dll' },
            @{ Name = 'DirectShow 虚拟摄像头 (x86)';  Path = 'artifacts/native/Win32/Release/SeewoVirtualCamera.DShow.dll' },
            @{ Name = '虚拟摄像头安装工具';          Path = 'artifacts/native/x64/Release/SeewoVirtualCamera.Setup.exe' },
            @{ Name = '防截屏载荷 (x64)';             Path = 'artifacts/native/x64/Release/SeewoCaptureGuard.Payload.dll' },
            @{ Name = '防截屏载荷 (x86)';             Path = 'artifacts/native/Win32/Release/SeewoCaptureGuard.Payload.dll' }
          )

          $missing = @()

          foreach ($item in $expected) {
            if (Test-Path $item.Path) {
              $size = (Get-Item $item.Path).Length
              Write-Host "  [OK]   $($item.Name) -> $($item.Path) ($size bytes)" -ForegroundColor Green
            } else {
              Write-Host "  [缺失] $($item.Name) -> $($item.Path)" -ForegroundColor Red
              $missing += $item.Name
            }
          }

          if ($missing.Count -gt 0) {
            Write-Host ''
            Write-Error "以下原生组件没有产出二进制文件：$($missing -join '、')"
            exit 1
          }

          Write-Host ''
          Write-Host '全部原生组件构建成功。' -ForegroundColor Green

      - name: Verify the managed build
        shell: pwsh
        run: |
          $failed = @()

          if ('${{ steps.restore_managed.outcome }}' -ne 'success') { $failed += '还原 NuGet 包' }
          if ('${{ steps.build_core.outcome }}'      -ne 'success') { $failed += 'SeewoAssistant.Core' }
          if ('${{ steps.build_tests.outcome }}'     -ne 'success') { $failed += 'SeewoAssistant.Tests' }
          if ('${{ steps.build_app.outcome }}'       -ne 'success') { $failed += 'SeewoAssistant' }

          if ($failed.Count -gt 0) {
            Write-Error "以下托管项目构建失败：$($failed -join '、')"
            exit 1
          }

          Write-Host '全部托管项目构建成功。' -ForegroundColor Green

      - name: Run the unit tests
        run: >
          dotnet test src/SeewoAssistant.Tests/SeewoAssistant.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory artifacts/test-results

      - name: Publish the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: ignore

      # ------------------------------------------------------------------ publish

      # Self-contained single file: the user extracts the zip and runs the exe with
      # no separate Windows App SDK or .NET install.
      # x64 only. The native components are built for x64 and Win32, and bitness
      # must match for the capture-guard payload to be injectable, so an ARM64
      # build would need every native project compiled for ARM64 as well. Shipping
      # an ARM64 archive whose native components could not load would be worse than
      # not shipping one, so it is deliberately omitted rather than half-done.
      - name: Publish the application (win-x64)
        run: >
          dotnet publish src/SeewoAssistant/SeewoAssistant.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true
          -p:Platform=x64
          -o artifacts/publish/win-x64

      # ------------------------------------------------------------------ assemble

      # Lay the release out the way the app expects to find it at runtime:
      #   SeewoAssistant.exe            the app
      #   SeewoVirtualCamera.Setup.exe  the camera management tool
      #   native/x64/...                the native components
      #   native/x86/...                the 32-bit DirectShow filter and payload
      #   scripts/                      install and uninstall helpers
      #   README.md, LICENSE            documentation
      - name: Assemble the release folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $target = 'artifacts/release/win-x64'
          New-Item -ItemType Directory -Force -Path $target | Out-Null

          Copy-Item 'artifacts/publish/win-x64/*' $target -Recurse -Force

          New-Item -ItemType Directory -Force -Path "$target/native/x64" | Out-Null
          New-Item -ItemType Directory -Force -Path "$target/native/x86" | Out-Null

          Copy-Item 'artifacts/native/x64/Release/*' "$target/native/x64/" -Force
          Copy-Item 'artifacts/native/Win32/Release/*' "$target/native/x86/" -Force

          # The setup tool sits next to the app so the app finds it by name.
          Copy-Item 'artifacts/native/x64/Release/SeewoVirtualCamera.Setup.exe' $target -Force

          Copy-Item 'scripts' "$target/scripts" -Recurse -Force
          Copy-Item 'README.md' $target -Force
          Copy-Item 'LICENSE' $target -Force

          Write-Host "Contents of $target :"
          Get-ChildItem $target -Recurse -File |
            Select-Object @{N='Path';E={$_.FullName.Replace($PWD.Path, '')}}, Length |
            Format-Table -AutoSize

      - name: Create the release archives
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts/dist | Out-Null

          Compress-Archive -Path 'artifacts/release/win-x64/*' `
            -DestinationPath 'artifacts/dist/SeewoAssistant-win-x64.zip' -Force

          # The native components on their own, for someone who already has the app
          # and only wants to update them.
          New-Item -ItemType Directory -Force -Path artifacts/native-package/x64 | Out-Null
          New-Item -ItemType Directory -Force -Path artifacts/native-package/x86 | Out-Null
          Copy-Item 'artifacts/native/x64/Release/*' 'artifacts/native-package/x64/' -Force -ErrorAction SilentlyContinue
          Copy-Item 'artifacts/native/Win32/Release/*' 'artifacts/native-package/x86/' -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path 'artifacts/native-package/*' `
            -DestinationPath 'artifacts/dist/SeewoAssistant-native-components.zip' -Force

          Get-ChildItem artifacts/dist | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload the release archives
        uses: actions/upload-artifact@v4
        with:
          name: SeewoAssistant-release
          path: artifacts/dist/*.zip
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------------------ release

      - name: Create a GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/dist/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
