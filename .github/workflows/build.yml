name: Build

# Compiles every component, runs the unit tests, and publishes the runnable
# artifacts. Pushing a tag additionally creates a Release with the same files
# attached.
#
# Verification of the built application lives in test.yml, which downloads the
# artifact this workflow produces. The two are separate so that "the code does not
# compile" and "the code compiles but the app is broken" are reported as different
# checks, and so a UI failure does not make the build look broken.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  # Keep the build deterministic and quiet.
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  # The runner has 4 cores and 16 GB; the managed build is small, but the native
  # build is memory hungry and parallel MSBuild instances add up.
  MSBUILDDISABLENODEREUSE: '1'

jobs:
  build:
    name: Build (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 60

    # Creating a Release and uploading its assets needs write access to repository
    # contents. GITHUB_TOKEN defaults to read-only, which is what produced
    # "403 Resource not accessible by integration" from the release step. The
    # permission is scoped to this job and limited to what the release needs.
    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      # The native projects pin a specific Windows SDK version. Printing what the
      # runner actually has makes a version mismatch obvious in the log instead of
      # surfacing as a confusing missing-header error.
      - name: Report the installed Windows SDKs
        shell: pwsh
        run: |
          $roots = @(
            "${env:ProgramFiles(x86)}\Windows Kits\10\Include",
            "$env:ProgramFiles\Windows Kits\10\Include"
          )
          foreach ($root in $roots) {
            if (Test-Path $root) {
              Write-Host "SDK include root: $root"
              Get-ChildItem $root -Directory | Select-Object -ExpandProperty Name | ForEach-Object { Write-Host "  $_" }
            }
          }
          Write-Host "MSBuild: $((Get-Command msbuild).Source)"

      - name: Show the MSBuild version
        run: msbuild -version

      # ------------------------------------------------------------------ native
      # Each native project is built separately rather than through the solution so a
      # failure names the exact component. continue-on-error keeps a failing native
      # project from hiding the managed build's diagnostics in the same run; the
      # "Verify the native outputs" step below is the real gate, and it fails the job
      # if any component did not produce its binary.

      # MSBuild reports a stray control character in a .vcxproj as a bare
      # "project file could not be loaded" with no hint about which byte is wrong.
      # Checking first turns an opaque failure into a precise one.
      - name: Validate the project files are well-formed XML
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = @()

          $files = Get-ChildItem -Recurse -Include '*.vcxproj', '*.csproj', '*.props', '*.targets' -File |
            Where-Object { $_.FullName -notmatch '\\(bin|obj)\\' }

          foreach ($file in $files) {
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            $bad = $bytes | Where-Object { $_ -lt 0x09 -or ($_ -ge 0x0B -and $_ -le 0x0C) -or ($_ -ge 0x0E -and $_ -le 0x1F) }

            if ($bad.Count -gt 0) {
              $hex = ($bad | Select-Object -First 3 | ForEach-Object { '0x{0:X2}' -f $_ }) -join ', '
              Write-Host "  [非法字符] $($file.FullName): $($bad.Count) 个控制字符（$hex）" -ForegroundColor Red
              $failed += $file.Name
              continue
            }

            try {
              [xml]$null = Get-Content $file.FullName -Raw
            } catch {
              Write-Host "  [XML 无效] $($file.FullName): $($_.Exception.Message)" -ForegroundColor Red
              $failed += $file.Name
            }
          }

          if ($failed.Count -gt 0) {
            Write-Error "以下项目文件无效：$($failed -join '、')"
            exit 1
          }

          Write-Host "已检查 $($files.Count) 个项目文件，全部有效。" -ForegroundColor Green

      # The XAML compiler reports a malformed file as a bare MSB3073 with a truncated
      # command line, which names neither the file nor the problem. Two mistakes are
      # worth catching here because they are easy to make with scripted edits and hard
      # to see by eye:
      #
      #   * an attribute written after the start tag's ">", which XML accepts as text
      #     content but the XAML compiler rejects
      #   * a Button with no automation name, which is unreachable for assistive
      #     technology and cannot be clicked by the UI test
      # Windows PowerShell 5.1 - the default shell on a stock Chinese Windows 10 - reads
      # a BOM-less .ps1 using the system ANSI code page, which is GBK there. GBK is a
      # double-byte encoding, so a Chinese character whose trailing byte is 0x9C swallows
      # the following closing quote and the script fails to parse. The shipped install
      # script was therefore unusable on exactly the machines this app targets, and CI
      # never noticed because it runs PowerShell 7, which defaults to UTF-8.
      #
      # This checks both the encoding and, using the Windows PowerShell parser, that the
      # script actually parses under 5.1.
      - name: Validate the PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $problems = @()
          $scripts = Get-ChildItem -Path 'scripts' -Recurse -Filter '*.ps1' -File

          foreach ($script in $scripts) {
            $bytes = [System.IO.File]::ReadAllBytes($script.FullName)

            # A UTF-8 BOM is what makes Windows PowerShell 5.1 decode the file correctly.
            $hasBom = $bytes.Length -ge 3 -and
                      $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF

            if (-not $hasBom) {
              $problems += "$($script.Name): 缺少 UTF-8 BOM，Windows PowerShell 5.1 会按 GBK 解码而解析失败"
            }

            # Parse with the Windows PowerShell 5.1 parser specifically, if present.
            $legacy = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"

            if (Test-Path $legacy) {
              $quoted = $script.FullName.Replace("'", "''")
              $command = "`$e = `$null; " +
                         "[System.Management.Automation.Language.Parser]::ParseFile('$quoted', [ref]`$null, [ref]`$e) | Out-Null; " +
                         "if (`$e.Count -gt 0) { `$e | ForEach-Object { `$_.Message }; exit 1 }"

              $output = & $legacy -NoProfile -NonInteractive -Command $command 2>&1
              $exit = $LASTEXITCODE

              if ($exit -ne 0) {
                $problems += "$($script.Name): 在 Windows PowerShell 5.1 下解析失败 -> $($output -join '; ')"
              }
            }
          }

          if ($problems.Count -gt 0) {
            Write-Host ''
            foreach ($p in $problems) { Write-Host "  $p" -ForegroundColor Red }
            Write-Error "PowerShell 脚本校验失败：$($problems.Count) 处问题"
            exit 1
          }

          Write-Host "已检查 $($scripts.Count) 个 PowerShell 脚本（含 UTF-8 BOM 与 5.1 解析）。" -ForegroundColor Green

      - name: Validate the XAML files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $problems = @()
          $files = Get-ChildItem -Path 'src' -Recurse -Filter '*.xaml' -File

          foreach ($file in $files) {
            $text = Get-Content $file.FullName -Raw

            # Well-formed XML is necessary but not sufficient; the checks below cover
            # what the XAML compiler adds on top.
            try {
              [xml]$null = $text
            } catch {
              $problems += "$($file.Name): XML 无效 - $($_.Exception.Message)"
              continue
            }

            $lines = Get-Content $file.FullName

            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -notmatch 'AutomationProperties\.Name=') { continue }

              # Only a *bare* attribute line can be misplaced. If the line opens an
              # element itself, the attribute is inline inside that element's start
              # tag and is correct - flagging it would be a false positive, which the
              # first version of this check produced.
              $line = $lines[$i]
              $beforeAttribute = $line.Substring(0, $line.IndexOf('AutomationProperties.Name'))
              if ($beforeAttribute.Contains('<')) { continue }

              # Walk back to the previous non-empty line. If it closes a start tag,
              # this bare attribute is outside the element.
              $j = $i - 1
              while ($j -ge 0 -and $lines[$j].Trim() -eq '') { $j-- }
              if ($j -lt 0) { continue }

              $prev = $lines[$j].TrimEnd()
              if ($prev.EndsWith('>') -and -not $prev.EndsWith('/>')) {
                $problems += "$($file.Name):$($i + 1): AutomationProperties.Name 写在起始标签之外"
              }
            }
          }

          if ($problems.Count -gt 0) {
            Write-Host ''
            foreach ($p in $problems) { Write-Host "  $p" -ForegroundColor Red }
            Write-Error "XAML 校验失败：$($problems.Count) 处问题"
            exit 1
          }

          Write-Host "已检查 $($files.Count) 个 XAML 文件，未发现问题。" -ForegroundColor Green

      - name: Build the Media Foundation virtual camera (x64)
        id: build_mf_camera
        continue-on-error: true
        run: >
          msbuild native/SeewoVirtualCamera/SeewoVirtualCamera.vcxproj
          /p:Configuration=Release /p:Platform=x64
          /m /v:minimal /nologo

      - name: Build the DirectShow virtual camera (x64)
        id: build_dshow_x64
        continue-on-error: true
        run: >
          msbuild native/SeewoVirtualCamera.DShow/SeewoVirtualCamera.DShow.vcxproj
          /p:Configuration=Release /p:Platform=x64
          /m /v:minimal /nologo

      - name: Build the DirectShow virtual camera (Win32)
        id: build_dshow_x86
        continue-on-error: true
        run: >
          msbuild native/SeewoVirtualCamera.DShow/SeewoVirtualCamera.DShow.vcxproj
          /p:Configuration=Release /p:Platform=Win32
          /m /v:minimal /nologo

      - name: Build the virtual camera setup tool (x64)
        id: build_setup_tool
        continue-on-error: true
        run: >
          msbuild native/SeewoVirtualCamera.Setup/SeewoVirtualCamera.Setup.vcxproj
          /p:Configuration=Release /p:Platform=x64
          /m /v:minimal /nologo

      - name: Restore managed packages
        id: restore_managed
        continue-on-error: true
        run: dotnet restore src/SeewoAssistant/SeewoAssistant.csproj

      - name: Build the core library
        id: build_core
        continue-on-error: true
        run: dotnet build src/SeewoAssistant.Core/SeewoAssistant.Core.csproj -c Release -m:1

      - name: Build the test project
        id: build_tests
        continue-on-error: true
        run: dotnet build src/SeewoAssistant.Tests/SeewoAssistant.Tests.csproj -c Release -m:1

      - name: Build the application
        id: build_app
        continue-on-error: true
        run: dotnet build src/SeewoAssistant/SeewoAssistant.csproj -c Release -m:1 -p:Platform=x64

      # ------------------------------------------------------------------ gate
      # One place that decides whether the job passes, so every component's
      # diagnostics are visible in the same run before anything is published.

      - name: Verify the native outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # List whatever the native projects actually produced before checking the
          # expected paths. If a project's OutDir ever drifts, this makes the real
          # location obvious in the log instead of leaving a bare "missing" message.
          Write-Host '实际产出的原生文件：'
          $found = Get-ChildItem -Path . -Recurse -Include '*.dll', '*.exe' -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\artifacts\\' -and $_.FullName -notmatch '\\obj\\' }

          if ($found) {
            $found | ForEach-Object {
              Write-Host "  $($_.FullName.Replace($PWD.Path, '')) ($($_.Length) bytes)"
            }
          } else {
            Write-Host '  （没有找到任何产物）'
          }

          Write-Host ''
          Write-Host '检查预期路径：'

          $expected = @(
            @{ Name = 'Media Foundation 虚拟摄像头'; Path = 'artifacts/native/x64/Release/SeewoVirtualCamera.dll' },
            @{ Name = 'DirectShow 虚拟摄像头 (x64)';  Path = 'artifacts/native/x64/Release/SeewoVirtualCamera.DShow.dll' },
            @{ Name = 'DirectShow 虚拟摄像头 (x86)';  Path = 'artifacts/native/Win32/Release/SeewoVirtualCamera.DShow.dll' },
            @{ Name = '虚拟摄像头安装工具';          Path = 'artifacts/native/x64/Release/SeewoVirtualCamera.Setup.exe' }
          )

          $missing = @()

          foreach ($item in $expected) {
            if (Test-Path $item.Path) {
              $size = (Get-Item $item.Path).Length
              Write-Host "  [OK]   $($item.Name) -> $($item.Path) ($size bytes)" -ForegroundColor Green
            } else {
              Write-Host "  [缺失] $($item.Name) -> $($item.Path)" -ForegroundColor Red
              $missing += $item.Name
            }
          }

          if ($missing.Count -gt 0) {
            Write-Host ''
            Write-Error "以下原生组件没有产出二进制文件：$($missing -join '、')"
            exit 1
          }

          Write-Host ''
          Write-Host '全部原生组件构建成功。' -ForegroundColor Green

      - name: Verify the managed build
        shell: pwsh
        run: |
          $failed = @()

          if ('${{ steps.restore_managed.outcome }}' -ne 'success') { $failed += '还原 NuGet 包' }
          if ('${{ steps.build_core.outcome }}'      -ne 'success') { $failed += 'SeewoAssistant.Core' }
          if ('${{ steps.build_tests.outcome }}'     -ne 'success') { $failed += 'SeewoAssistant.Tests' }
          if ('${{ steps.build_app.outcome }}'       -ne 'success') { $failed += 'SeewoAssistant' }

          if ($failed.Count -gt 0) {
            Write-Error "以下托管项目构建失败：$($failed -join '、')"
            exit 1
          }

          Write-Host '全部托管项目构建成功。' -ForegroundColor Green

      - name: Run the unit tests
        run: >
          dotnet test src/SeewoAssistant.Tests/SeewoAssistant.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory artifacts/test-results

      - name: Publish the test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: ignore

      # ------------------------------------------------------------------ publish

      # Self-contained single file: the user extracts the zip and runs the exe with
      # no separate Windows App SDK or .NET install.
      # x64 only. The native components are built for x64 and Win32, and bitness
      # must match for the capture-guard payload to be injectable, so an ARM64
      # build would need every native project compiled for ARM64 as well. Shipping
      # an ARM64 archive whose native components could not load would be worse than
      # not shipping one, so it is deliberately omitted rather than half-done.
      #
      # Single-file is attempted first because it is the nicest artifact to hand a
      # user. It depends on the Windows App SDK generating an embedded
      # resources.pri, which is sensitive to SDK version, so a plain self-contained
      # folder publish is kept as a fallback. Both are extract-and-run; the step
      # summary says which one produced the archive so the difference is never
      # silent.
      - name: Publish the application (win-x64, single file)
        id: publish_single_file
        continue-on-error: true
        run: >
          dotnet publish src/SeewoAssistant/SeewoAssistant.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true
          -p:EnableMsixTooling=true
          -p:Platform=x64
          -o artifacts/publish/win-x64

      - name: Publish the application (win-x64, self-contained folder)
        if: steps.publish_single_file.outcome != 'success'
        run: |
          Write-Host "Single-file publish did not succeed; falling back to a self-contained folder publish." -ForegroundColor Yellow
          dotnet publish src/SeewoAssistant/SeewoAssistant.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -p:Platform=x64 `
            -o artifacts/publish/win-x64
        shell: pwsh

      - name: Record which publish mode was used
        shell: pwsh
        run: |
          if ('${{ steps.publish_single_file.outcome }}' -eq 'success') {
            Write-Host '发布模式：单文件 exe' -ForegroundColor Green
            "PublishMode=单文件 exe" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          } else {
            Write-Host '发布模式：自包含文件夹（单文件发布未成功，已回退）' -ForegroundColor Yellow
            "PublishMode=自包含文件夹（单文件发布未成功，已回退）" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      # ------------------------------------------------------------------ assemble

      # Lay the release out the way the app expects to find it at runtime:
      #   SeewoAssistant.exe            the app
      #   SeewoVirtualCamera.Setup.exe  the camera management tool
      #   native/x64/...                the native components
      #   native/x86/...                the 32-bit DirectShow filter and payload
      #   scripts/                      install and uninstall helpers
      #   README.md, LICENSE            documentation
      - name: Assemble the release folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $target = 'artifacts/release/win-x64'
          New-Item -ItemType Directory -Force -Path $target | Out-Null

          Copy-Item 'artifacts/publish/win-x64/*' $target -Recurse -Force

          New-Item -ItemType Directory -Force -Path "$target/native/x64" | Out-Null
          New-Item -ItemType Directory -Force -Path "$target/native/x86" | Out-Null

          # Only the loadable binaries are shipped. The linker also emits .pdb, .exp
          # and .lib files next to them; those are build intermediates and would
          # roughly triple the download for no benefit to the user.
          foreach ($pair in @(
              @{ Source = 'artifacts/native/x64/Release';   Destination = "$target/native/x64" },
              @{ Source = 'artifacts/native/Win32/Release'; Destination = "$target/native/x86" })) {

            Get-ChildItem $pair.Source -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Extension -in '.dll', '.exe' } |
              ForEach-Object { Copy-Item $_.FullName $pair.Destination -Force }
          }

          # The setup tool sits next to the app so the app finds it by name, AND the
          # media source DLL sits next to the setup tool, because the tool resolves
          # that DLL relative to its own directory. Shipping the tool at the root with
          # its DLL only under native/x64/ is what made every install fail with
          # "找不到媒体源 DLL".
          Copy-Item 'artifacts/native/x64/Release/SeewoVirtualCamera.Setup.exe' $target -Force
          Copy-Item 'artifacts/native/x64/Release/SeewoVirtualCamera.dll' $target -Force

          # Drop the debug symbols the managed publish produced; they are useful when
          # attached to a build but not in a user-facing download.
          Get-ChildItem $target -Filter '*.pdb' -File | Remove-Item -Force

          Copy-Item 'scripts' "$target/scripts" -Recurse -Force
          Copy-Item 'README.md' $target -Force
          Copy-Item 'LICENSE' $target -Force

          # Fail loudly if an expected piece is missing, rather than shipping a zip
          # that looks complete but is not.
          $required = @(
            "$target/SeewoAssistant.exe",
            "$target/SeewoVirtualCamera.Setup.exe",
            # Must sit beside the setup tool; the tool loads it from its own folder.
            "$target/SeewoVirtualCamera.dll",
            "$target/native/x64/SeewoVirtualCamera.dll",
            "$target/native/x64/SeewoVirtualCamera.DShow.dll",
            "$target/native/x86/SeewoVirtualCamera.DShow.dll",
            "$target/scripts/Install-Native.ps1"
          )

          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Error "发行包缺少以下文件：`n$($missing -join "`n")"
            exit 1
          }

          Write-Host "Contents of $target :"
          Get-ChildItem $target -Recurse -File |
            Select-Object @{N='Path';E={$_.FullName.Replace($PWD.Path, '')}}, Length |
            Format-Table -AutoSize

          $totalMb = [math]::Round((Get-ChildItem $target -Recurse -File | Measure-Object Length -Sum).Sum / 1MB, 1)
          Write-Host "发行包总大小：$totalMb MB"

      - name: Create the release archives
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts/dist | Out-Null

          Compress-Archive -Path 'artifacts/release/win-x64/*' `
            -DestinationPath 'artifacts/dist/SeewoAssistant-win-x64.zip' -Force

          # The native components on their own, for someone who already has the app
          # and only wants to update them. Binaries only, for the same reason as the
          # main archive.
          New-Item -ItemType Directory -Force -Path artifacts/native-package/x64 | Out-Null
          New-Item -ItemType Directory -Force -Path artifacts/native-package/x86 | Out-Null

          foreach ($pair in @(
              @{ Source = 'artifacts/native/x64/Release';   Destination = 'artifacts/native-package/x64' },
              @{ Source = 'artifacts/native/Win32/Release'; Destination = 'artifacts/native-package/x86' })) {

            Get-ChildItem $pair.Source -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Extension -in '.dll', '.exe' } |
              ForEach-Object { Copy-Item $_.FullName $pair.Destination -Force }
          }

          Compress-Archive -Path 'artifacts/native-package/*' `
            -DestinationPath 'artifacts/dist/SeewoAssistant-native-components.zip' -Force

          Get-ChildItem artifacts/dist | Select-Object Name, Length | Format-Table -AutoSize

      # ------------------------------------------------------------------ installer
      # A second way to distribute the *same* assembled release tree. The zip is
      # still the primary artifact - it is what "解压即用" means and what the smoke
      # test in test.yml consumes - so this step must never be able to take the
      # zip down with it. It is therefore continue-on-error, and the step below
      # decides purely from the file on disk what actually reaches the Release.
      #
      # The installer is worth having because the zip cannot offer the two things
      # a Windows user expects: choosing where the program goes, and deciding
      # which shortcuts to create.
      - name: Build the installer (Inno Setup)
        id: build_installer
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not (Test-Path 'installer/SeewoAssistant.iss')) {
            Write-Error '缺少 installer/SeewoAssistant.iss，无法编译安装包。'
            exit 1
          }

          # The Chocolatey package id is `innosetup`; it installs Inno Setup 6 and
          # puts a shim for ISCC.exe on PATH. --no-progress keeps the log readable.
          choco install innosetup -y --no-progress

          # The shim lands on PATH, but a shell that is already running - and the
          # runner's pwsh is - may not observe the refreshed PATH. Fall back to the
          # well-known install location instead of failing on an environment quirk.
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source

          if (-not $iscc) {
            $candidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
            )
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }

          if (-not $iscc) {
            Write-Error '安装 Inno Setup 之后仍然找不到 ISCC.exe。'
            exit 1
          }

          Write-Host "使用编译器：$iscc"

          # On a tag push the version comes from the tag with its leading "v"
          # stripped, because AppVersion has to be a plain version number and the
          # installer should match the Release it is attached to. Every other
          # build leaves the script's own default in place.
          $version = '0.0.0'
          if ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          }

          # AppVersion may carry a prerelease suffix ("1.2.3-rc1"), but Inno Setup's
          # VersionInfoVersion directive accepts only up to four dot-separated
          # numbers, and passing it a suffix fails the compile. The numeric part is
          # therefore extracted here and passed as a second define.
          $numeric = $version
          if ($numeric -match '^(\d+(?:\.\d+){0,3})') {
            $numeric = $Matches[1]
          } else {
            $numeric = '0.0.0'
          }

          Write-Host "安装包版本：$version（版本号字段：$numeric）"

          New-Item -ItemType Directory -Force -Path 'artifacts/dist' | Out-Null

          & $iscc 'installer/SeewoAssistant.iss' "/DAppVersion=$version" "/DAppVersionNumeric=$numeric"
          $compileExit = $LASTEXITCODE
          Write-Host "ISCC 退出码：$compileExit"

          # The exit code alone is not trusted: what this step exists to produce is
          # a file. A compiler that returned 0 without emitting anything would be
          # recorded as a success and put a Release out with a missing asset.
          $installer = 'artifacts/dist/SeewoAssistant-Setup-x64.exe'

          if (-not (Test-Path $installer)) {
            Write-Error "ISCC 以退出码 $compileExit 结束，但没有产出 $installer"
            exit 1
          }

          if ($compileExit -ne 0) {
            Write-Error "ISCC 报告失败（退出码 $compileExit），却产出了 $installer，产物不可信"
            exit 1
          }

          $size = (Get-Item $installer).Length
          Write-Host "安装包已生成：$installer ($size 字节)" -ForegroundColor Green

      # The zip is always published; the installer only when it was actually
      # produced. Reading the file rather than the previous step's outcome is what
      # keeps "Inno Setup was unavailable" and "compilation failed" from either
      # failing the build or sneaking a missing asset into the Release.
      - name: Record whether the installer was built
        id: installer_status
        shell: pwsh
        run: |
          $installer = 'artifacts/dist/SeewoAssistant-Setup-x64.exe'

          $files = @(
            'artifacts/dist/SeewoAssistant-win-x64.zip',
            'artifacts/dist/SeewoAssistant-native-components.zip'
          )

          if (Test-Path $installer) {
            $sizeMb = [math]::Round((Get-Item $installer).Length / 1MB, 1)
            Write-Host "安装包：已生成（$sizeMb MB）" -ForegroundColor Green
            "安装包（exe）：已生成（$sizeMb MB）" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            $files += $installer

            # The release notes must not promise an asset that is not attached, so
            # the paragraph describing the installer is built here, from the same
            # file existence check, rather than hard-coded in the release step.
            $installerNote = @(
              '**方式一：安装程序（推荐）**',
              '',
              '下载 `SeewoAssistant-Setup-x64.exe` 运行，可以自选安装目录，并勾选是否创建',
              '桌面快捷方式和开始菜单快捷方式。安装程序默认按「所有用户」安装，需要管理员',
              '权限；在安装模式对话框里也可以改为「仅为我安装」，那样不需要管理员权限。',
              '卸载请使用「设置 → 应用」或安装目录下的 `unins000.exe`。'
            ) -join "`n"
          } else {
            Write-Host '安装包：未生成，本次只发布 zip。' -ForegroundColor Yellow
            "安装包（exe）：未生成（Inno Setup 不可用或编译失败），本次只发布 zip" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

            $installerNote = @(
              '**方式一：安装程序**',
              '',
              '本次构建没有生成安装程序，请使用下方的 `SeewoAssistant-win-x64.zip`。'
            ) -join "`n"
          }

          # Multi-line outputs, so the release step uses exactly the assets that
          # exist rather than a glob that might match nothing.
          "release_files<<__RELEASE_FILES__" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $files | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "__RELEASE_FILES__" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          "installer_note<<__INSTALLER_NOTE__" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $installerNote | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "__INSTALLER_NOTE__" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload the release archives
        uses: actions/upload-artifact@v6
        with:
          name: SeewoAssistant-release
          # Everything in artifacts/dist: the two zips, plus the installer when it
          # was produced. A single glob is used deliberately - the zips are always
          # there, so this can never match nothing and turn a missing installer
          # into a failed upload of the primary artifact.
          path: artifacts/dist/*
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------------------ release

      # Builds on a tag always produce the archives as an artifact even if the
      # Release itself cannot be created, so the downloadable output never depends
      # on the release step succeeding. Release notes are supplied explicitly
      # rather than generated, because generating them needs an extra API call and
      # permission that a tag push does not always carry.
      #
      # The asset list comes from the step above so the installer is attached only
      # when it was really produced; a wildcard would silently attach whatever
      # happened to be on disk.
      - name: Create a GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.installer_status.outputs.release_files }}
          name: 希沃助手 ${{ github.ref_name }}
          body: |
            发行版提供两种安装方式。

            ${{ steps.installer_status.outputs.installer_note }}

            **方式二：解压即用**

            下载 `SeewoAssistant-win-x64.zip`，解压到任意目录，双击 `SeewoAssistant.exe`
            即可运行，无需安装。

            两种方式的内容完全相同，都不需要安装 .NET 运行时、Windows App SDK 运行时
            或 VC++ 可再发行组件。

            首次使用虚拟摄像头需要以管理员身份运行 `scripts\Install-Native.ps1 -Action Install`
            注册原生组件。详见压缩包内的 README.md。

            **系统要求：** Windows 10 版本 2004（内部版本 19041）或更高，x64。
            Windows 11 使用官方虚拟摄像头 API；Windows 10 使用 DirectShow 回退方案，
            摄像头不会出现在系统「设置」的相机列表中，但 Zoom、OBS、ffmpeg 等应用可以使用。
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
